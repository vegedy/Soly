name: soly

x-soly-stack:
  timeout: ${SOLY_STACK_TIMEOUT:-180}

x-processing: &processing
  image: ${SOLY_PROCESSING_IMAGE:-soly-processing:local-stack}
  platform: linux/amd64
  pull_policy: never
  environment: &flink-environment
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      rest.address: jobmanager
      rest.bind-address: 0.0.0.0
      jobmanager.bind-host: 0.0.0.0
      taskmanager.bind-host: 0.0.0.0
      jobmanager.memory.process.size: ${SOLY_JOBMANAGER_MEMORY:-1024m}
      taskmanager.memory.process.size: ${SOLY_TASKMANAGER_MEMORY:-2048m}
      taskmanager.numberOfTaskSlots: ${SOLY_TASK_SLOTS:-2}
      python.client.executable: /opt/python/bin/python3
      python.executable: /opt/python/bin/python3

services:
  kafka:
    image: apache/kafka:4.2.2@sha256:daa39dc85acd37b148fad74d6b22b60fa5f7fa05048a5c8aa3b654140c63dd58
    platform: linux/amd64
    ports:
      - "127.0.0.1:${SOLY_KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${SOLY_KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: ${SOLY_KAFKA_HEAP:--Xms512m -Xmx512m}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:19092, --list]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.2.2@sha256:daa39dc85acd37b148fad74d6b22b60fa5f7fa05048a5c8aa3b654140c63dd58
    platform: linux/amd64
    profiles: [tools]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SOLY_KAFKA_TOPIC: ${SOLY_KAFKA_TOPIC:-soly-infra-smoke}
      SOLY_KAFKA_PARTITIONS: ${SOLY_KAFKA_PARTITIONS:-1}
    volumes:
      - ./docker/init-topic.sh:/opt/soly/init-topic.sh:ro
    entrypoint: [bash, /opt/soly/init-topic.sh]

  postgres:
    image: postgres:18.6-bookworm@sha256:02fb3245e038f33536cf13bc6c4e59f21d07b0cea3c1fe1c07c6e8aa8f083bcc
    platform: linux/amd64
    ports:
      - "127.0.0.1:${SOLY_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${SOLY_POSTGRES_DB:-soly}
      POSTGRES_USER: ${SOLY_POSTGRES_USER:-soly}
      POSTGRES_PASSWORD: ${SOLY_POSTGRES_PASSWORD:?Copy .env.example to .env or pass --env-file}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  jobmanager:
    <<: *processing
    command: jobmanager
    ports:
      - "127.0.0.1:${SOLY_FLINK_PORT:-8081}:8081"
    healthcheck:
      test: [CMD, /opt/python/bin/python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/overview', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  taskmanager:
    <<: *processing
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy

volumes:
  kafka-data:
  postgres-data:
