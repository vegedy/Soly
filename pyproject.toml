[tool.pytest.ini_options]
minversion = "9.1.1"
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers -m 'not service_copies'"
markers = ["service_copies: integrated submodule artifact and provenance checks"]

[tool.ruff]
required-version = "==0.17.2"
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["tests"]
strict = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
