name: Contracts

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: checkout with spaces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: checkout with spaces
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
      - name: Set up development dependencies
        run: ./dev.sh setup --use-current-python
      - name: Check repository through Unix
        run: ./dev.sh check --use-current-python
      - name: Check repository through PowerShell
        shell: pwsh
        run: ./dev.ps1 check --use-current-python

  service-copies:
    needs: contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
      - name: Set up contract check dependencies
        run: ./dev.sh setup --use-current-python
      - name: Verify integrated service copies and provenance
        run: ./dev.sh check-integration --use-current-python
